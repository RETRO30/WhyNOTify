version: "3.5"

services:
  admin:
    build:
      context: admin
      dockerfile: Dockerfile
    container_name: admin_service
    env_file:
      - .env
    volumes:
      - ./database:/app/database  # Общий модуль database
      - ./utils:/app/utils
    depends_on:
      - migrations

  notifications:
    build:
      context: notifications
      dockerfile: Dockerfile
    container_name: notifications_service
    env_file:
      - .env
    volumes:
      - ./database:/app/database  # Общий модуль database
      - ./utils:/app/utils
    depends_on:
      - migrations
      # - test_api

  database:
    image: postgres:17
    container_name: postgres_db
    restart: always
    user: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: /usr/bin/pg_isready
      start_period: 5s
      interval: 10s
      timeout: 10s
      retries: 5

  migrations:
    build:
      context: migrations
      dockerfile: Dockerfile
    container_name: migrations_service
    env_file:
      - .env
    volumes:
      - migrations_data:/app/migrations/versions
      - ./database:/app/database
      - ./utils:/app/utils
    depends_on:
      database:
        condition: service_healthy

  # test_api:
  #   build:
  #     context: test_api
  #     dockerfile: Dockerfile
  #   container_name: test_api_service
  #   env_file:
  #     - .env
  #   ports:
  #     - "8000:8000"

volumes:
  postgres_data:
  migrations_data: