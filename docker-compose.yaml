version: "3.5"

services:
  admin:
    build:
      context: admin
      dockerfile: Dockerfile
    container_name: admin_service
    env_file:
      - .env
    volumes:
      - ./database:/app/database  # Общий модуль database
      - ./utils:/app/utils
    depends_on:
      database:
        condition: service_healthy

  notifications:
    build:
      context: notifications
      dockerfile: Dockerfile
    container_name: notifications_service
    env_file:
      - .env
    volumes:
      - ./database:/app/database  # Общий модуль database
      - ./utils:/app/utils
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    container_name: postgres_db
    restart: always
    user: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: /usr/bin/pg_isready
      start_period: 5s
      interval: 10s
      timeout: 10s
      retries: 5

  test_api:
    build:
      context: test_api
      dockerfile: Dockerfile
    container_name: test_api_service
    volumes:
      - ./utils:/app/utils
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  postgres_data: